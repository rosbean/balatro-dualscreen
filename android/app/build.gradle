import java.nio.charset.StandardCharsets

apply plugin: 'com.android.application'

android {
    namespace "org.love2d.android.executable"
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId project.properties["app.application_id"]
        versionCode project.properties["app.version_code"].toInteger()
        versionName project.properties["app.version_name"]
        minSdk 26
        compileSdk 34
        targetSdk 34
        
        def getAppName = {
            def nameArray = project.properties["app.name_byte_array"]
            def name = project.properties["app.name"]
            if (name != null && nameArray != null) {
                throw new Exception("Only define either `app.name` or `app.name_byte_array` in gradle.properties, but not both!")
            }

            if (name == null) {
                def nameArraySplit = nameArray.split(",")
                def nameBytes = new byte[nameArraySplit.length]
                def count = 0
                for (String s: nameArraySplit) {
                    nameBytes[count++] = (byte) Integer.parseInt(s)
                }
                return new String(nameBytes, StandardCharsets.UTF_8)
            }
            return name
        }

        // The game's own icon, extracted at build time from the user's
        // Balatro container into the gitignored generated overlay (rule #1:
        // no Balatro assets in the repo). When the file is absent -- icon
        // extraction is best-effort -- the stock LOVE icon stays.
        def balatroIcon = file("src/generated/icon-res/drawable-nodpi/balatro_icon_fg.png")

        manifestPlaceholders = [
            NAME:getAppName(),
            ORIENTATION:project.properties["app.orientation"],
            ICON:(balatroIcon.exists() ? "@mipmap/balatro_icon" : "@mipmap/ds_icon"),
        ]
    }
    signingConfigs {
        if (project.hasProperty('BALATRO_STORE_FILE')) {
            release {
                storeFile file(BALATRO_STORE_FILE)
                storePassword BALATRO_STORE_PASSWORD
                keyAlias BALATRO_KEY_ALIAS
                keyPassword BALATRO_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Release is what ships: debuggable=false, R8 enabled. Signing
            // uses a proper release key when one is configured in
            // ~/.gradle/gradle.properties, and otherwise falls back to the
            // debug key so anyone can build an installable APK from source.
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }
    sourceSets {
        main {
            // Build-time generated resources (the extracted game icon).
            res.srcDirs += 'src/generated/icon-res'
        }
    }

    flavorDimensions = ['mode', 'recording']
    productFlavors {
        normal {
            dimension 'mode'
        }
        embed {
            dimension 'mode'
        }
        record {
            dimension 'recording'
        }
        noRecord {
            dimension 'recording'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    api 'androidx.multidex:multidex:2.0.1'
    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'androidx.appcompat:appcompat:1.6.1'
    api project(':love')
}
