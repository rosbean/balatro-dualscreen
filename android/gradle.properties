# To set the application display name, only define either `app.name` or `app.name_byte_array`.
# For a rule of thumb:
# * Use `app.name` if your app name doesn't contain any non-ANSI characters.
# * Otherwise, convert your app name to UTF-8 byte array, comma delimited, and put
#   it in `app.name_byte_array`
# balatro-dualscreen-thor: our name is ASCII, so app.name is used directly.
# app.name and app.name_byte_array are mutually exclusive - app/build.gradle
# throws if both are set, so the byte-array form is removed rather than commented.
app.name=Balatro Dual-Screen

app.application_id=com.balatro.dualscreen
app.orientation=landscape
app.version_code=1
app.version_name=0.1

# No need to modify anything past this line!
android.enableJetifier=false
android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
